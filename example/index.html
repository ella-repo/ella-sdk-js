<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ella SDK — demo</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            }
            body {
                margin: 0;
                padding: 24px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                max-width: 640px;
            }
            h1 {
                font-size: 20px;
                margin: 0;
            }
            .row {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 14px;
            }
            .dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #c0392b;
            }
            .dot.ok {
                background: #27ae60;
            }
            button {
                font-size: 16px;
                padding: 12px 20px;
                border: none;
                border-radius: 10px;
                background: #4f46e5;
                color: #fff;
                cursor: pointer;
                align-self: flex-start;
            }
            button:disabled {
                opacity: 0.5;
                cursor: default;
            }
            pre {
                white-space: pre-wrap;
                word-break: break-all;
                background: rgba(127, 127, 127, 0.12);
                padding: 14px;
                border-radius: 10px;
                font-size: 13px;
                min-height: 24px;
                margin: 0;
            }
            .label {
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                opacity: 0.6;
            }
            .error {
                color: #c0392b;
            }
        </style>
    </head>
    <body>
        <h1>Ella SDK</h1>

        <div class="row">
            <span id="host-dot" class="dot"></span>
            <span id="host-status">Checking host…</span>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <button id="get-token" disabled>Get token</button>
            <button id="get-content-api-url" disabled>Get content API URL</button>
            <button id="get-both" disabled>Both</button>
        </div>

        <div>
            <div class="label">Result</div>
            <pre id="output">—</pre>
        </div>

        <!--
          In production, load the hosted UMD bundle instead:
          <script src="https://<ella-sdk-js-host>/ella-sdk-js.umd.js"></script>
          The bundle sits next to this file (copied here by `npm run build`), so it
          resolves no matter which directory is served.
        -->
        <script src="./ella-sdk-js.umd.js"></script>
        <script>
            const dot = document.getElementById('host-dot');
            const hostStatus = document.getElementById('host-status');
            const output = document.getElementById('output');
            const buttons = Array.from(document.querySelectorAll('button'));

            if (!window.Ella) {
                // The UMD bundle failed to load (wrong path / not served / not built).
                dot.classList.remove('ok');
                hostStatus.textContent = 'SDK bundle failed to load — ./ella-sdk-js.umd.js not found. Run `npm run build`.';
            } else {
                const inside = window.Ella.isInsideElla();
                dot.classList.toggle('ok', inside);
                hostStatus.textContent = inside
                    ? 'Running inside the Ella app ✓'
                    : 'Not inside the Ella app — calls reject with NOT_IN_ELLA';
                buttons.forEach((b) => (b.disabled = false));

                const run = async (fn) => {
                    buttons.forEach((b) => (b.disabled = true));
                    output.classList.remove('error');
                    output.textContent = 'Requesting…';
                    try {
                        const value = await fn();
                        output.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
                    } catch (err) {
                        output.classList.add('error');
                        output.textContent = `${err.name} [${err.code}]: ${err.message}`;
                    } finally {
                        buttons.forEach((b) => (b.disabled = false));
                    }
                };

                document.getElementById('get-token').addEventListener('click', () => run(() => window.Ella.getToken()));
                document
                    .getElementById('get-content-api-url')
                    .addEventListener('click', () => run(() => window.Ella.getContentApiUrl()));
                document.getElementById('get-both').addEventListener('click', () =>
                    run(async () => {
                        const [token, contentApiUrl] = await Promise.all([
                            window.Ella.getToken(),
                            window.Ella.getContentApiUrl(),
                        ]);
                        return { token, contentApiUrl };
                    })
                );
            }
        </script>
    </body>
</html>
